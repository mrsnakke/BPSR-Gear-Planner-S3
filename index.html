<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gear Build Planner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Archivos CSS y Configuración -->
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="text-gray-100 min-h-screen pb-12">

    <!-- Header Section -->
    <header id="main-header" class="border-b border-gray-800 bg-gray-950 bg-opacity-90 backdrop-blur sticky top-0 z-50 py-4 px-6 mb-8 shadow-md transition-all duration-300">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-wider bg-gradient-to-r from-gameOrange via-gameGold to-gamePurple bg-clip-text text-transparent uppercase text-center md:text-left">
                    Gear Planner
                </h1>
            </div>

            <div class="flex flex-wrap items-center justify-center gap-4">
                
                <!-- Selector de Idioma -->
                <div class="flex items-center gap-2 bg-gray-900 border border-gray-800 p-1.5 rounded-xl shadow-lg">
                    <button onclick="changeLanguage('es')" id="btn-lang-es" class="px-2 py-1 text-xs font-bold rounded bg-gameOrange text-white">ES</button>
                    <button onclick="changeLanguage('en')" id="btn-lang-en" class="px-2 py-1 text-xs font-bold rounded text-gray-500 hover:text-white">EN</button>
                </div>

                <!-- Build Selector -->
                <div class="flex items-center gap-3 bg-gray-900 border border-gray-800 p-2 rounded-xl shadow-lg">
                    <span id="ui-build-label" class="text-xs uppercase tracking-widest text-gray-400 font-semibold pl-2">Build:</span>
                    <select id="global-build-select" onchange="changeBuild(this.value)" class="bg-gray-950 border border-gray-700 text-gameGold text-sm font-bold rounded-lg px-3 py-1.5 focus:outline-none focus:border-gameGold cursor-pointer transition-colors hover:bg-gray-800">
                        <option value="strength" id="opt-strength">Fuerza</option>
                        <option value="intelligence" id="opt-intelligence">Inteligencia</option>
                        <option value="agility" id="opt-agility">Agilidad</option>
                    </select>
                </div>
                
                <!-- Global Stats Summary Panel -->
                <div class="flex items-center gap-4 bg-gray-900 border border-gray-800 p-2 rounded-xl shadow-lg">
                    <div class="text-center px-3">
                        <span id="ui-bis-label" class="block text-xs uppercase tracking-widest text-gray-400 font-semibold">BiS</span>
                        <span id="global-progress" class="text-xl font-bold text-gameGold">0/11</span>
                    </div>
                    <div class="h-8 w-px bg-gray-800 hidden sm:block"></div>
                    <div class="text-center px-3 hidden sm:block">
                        <span id="ui-sigils-label" class="block text-xs uppercase tracking-widest text-gray-400 font-semibold">Sigilos</span>
                        <span id="global-sigils" class="text-xl font-bold text-gamePurple">0</span>
                    </div>
                    <div class="h-8 w-px bg-gray-800"></div>
                    <div class="pr-1">
                        <button onclick="resetPlanner()" id="ui-reset-btn" class="px-3 py-1.5 bg-red-950/50 hover:bg-red-900 border border-red-900 hover:border-red-600 text-red-300 text-xs font-semibold rounded-lg uppercase tracking-wider transition-colors duration-200">
                            Reset
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-4 md:px-6">
        
        <!-- Contenedores Dinámicos -->
        <div id="priority-farming-panel" class="mb-8"></div>
        <div id="dungeon-efficiency-panel" class="mb-10"></div>

        <!-- Título de Sección -->
        <div class="flex items-center gap-3 mb-6">
            <h2 id="ui-inventory-title" class="text-2xl font-bold tracking-wider uppercase text-white">Inventario de Equipo</h2>
            <div class="flex-grow h-px bg-gradient-to-r from-gray-800 to-transparent"></div>
        </div>

        <!-- Contenedor Principal de Cartas -->
        <div id="gear-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-3 gap-6"></div>

    </main>

    <footer class="mt-16 text-center text-xs text-gray-500 max-w-7xl mx-auto px-6 py-8 border-t border-gray-900">
        <p id="ui-footer-text">Planner interactivo. El progreso se guarda en tu navegador.</p>
    </footer>

    <!-- Scripts en orden de dependencia -->
    <script src="js/i18n.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
